<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Катушка">
<title>Катушка — диктофон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15141A;
    --surface:#1F1D26;
    --surface-hi:#2A2833;
    --text:#F3F1EC;
    --text-muted:#8D899A;
    --accent:#FF5940;
    --accent-dim:#5A2A22;
    --calm:#57C6B4;
    --divider:#312E3A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;overscroll-behavior:none;height:100%;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    display:flex;flex-direction:column;min-height:100vh;}
  .mono{font-family:'Space Mono',monospace;}
  ::selection{background:var(--accent);color:#fff;}

  /* Header */
  header{padding:22px 20px 8px;display:flex;align-items:baseline;justify-content:space-between;}
  header h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-0.02em;}
  header .sub{font-size:11px;color:var(--text-muted);margin-top:2px;}

  /* Install banner */
  .install-banner{margin:0 20px 10px;padding:10px 14px;background:var(--surface);
    border:1px solid var(--divider);border-radius:12px;font-size:12.5px;color:var(--text-muted);
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .install-banner button{background:none;border:none;color:var(--text-muted);font-size:16px;
    cursor:pointer;padding:0 4px;line-height:1;}

  /* Recorder hero */
  .recorder{padding:8px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .waveform{width:100%;max-width:340px;height:56px;display:block;}
  .counter{font-size:34px;font-weight:700;letter-spacing:0.04em;color:var(--text);
    min-height:40px;display:flex;align-items:center;gap:8px;}
  .counter .dim{color:var(--text-muted);font-size:16px;font-weight:400;}
  .rec-btn{width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;
    background:var(--accent);position:relative;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 0 rgba(255,89,64,0.5);transition:transform .15s ease;}
  .rec-btn:active{transform:scale(0.94);}
  .rec-btn .core{width:26px;height:26px;border-radius:8px;background:#fff;transition:all .2s ease;}
  .rec-btn.recording{animation:pulse 1.6s ease-out infinite;}
  .rec-btn.recording .core{border-radius:6px;width:24px;height:24px;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,89,64,0.45);}
    70%{box-shadow:0 0 0 16px rgba(255,89,64,0);}
    100%{box-shadow:0 0 0 0 rgba(255,89,64,0);}
  }
  .rec-hint{font-size:12px;color:var(--text-muted);height:16px;text-align:center;}
  .live-transcript{width:100%;max-width:340px;min-height:20px;max-height:80px;overflow-y:auto;
    font-size:13px;color:var(--text-muted);text-align:center;line-height:1.5;padding:0 6px;}
  .live-transcript .final{color:var(--text);}

  /* Folder chips */
  .folders{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 14px;scrollbar-width:none;}
  .folders::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:var(--surface);
    border:1px solid var(--divider);font-size:13px;color:var(--text-muted);cursor:pointer;
    white-space:nowrap;font-weight:500;transition:all .15s ease;}
  .chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .chip .count{opacity:0.6;margin-left:4px;}

  /* Entries list */
  main{flex:1;padding:0 20px 24px;}
  .empty{text-align:center;color:var(--text-muted);font-size:13.5px;padding:60px 20px;line-height:1.6;}
  .entry{background:var(--surface);border:1px solid var(--divider);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s ease;}
  .entry:active{border-color:var(--accent);}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .entry-title{font-size:14.5px;font-weight:600;line-height:1.35;}
  .entry-meta{display:flex;gap:8px;margin-top:6px;align-items:center;}
  .tag{font-size:10.5px;font-weight:600;color:var(--calm);background:rgba(87,198,180,0.12);
    padding:2px 8px;border-radius:6px;letter-spacing:0.02em;text-transform:uppercase;}
  .time{font-size:11px;color:var(--text-muted);}
  .entry-summary{font-size:12.5px;color:var(--text-muted);margin-top:6px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .analyzing{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);}
  .spinner{width:12px;height:12px;border:2px solid var(--divider);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;flex:0 0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Detail modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10;
    opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);z-index:11;
    border-radius:20px 20px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:82vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;
    border-top:1px solid var(--divider);}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--divider);border-radius:2px;margin:0 auto 16px;}
  .sheet h2{font-size:19px;margin:0 0 6px;font-weight:700;line-height:1.3;}
  .sheet .meta-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
  .sheet audio{width:100%;margin-bottom:16px;height:36px;}
  .sheet .block-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--text-muted);font-weight:600;margin:16px 0 6px;}
  .sheet .summary-text{font-size:13.5px;line-height:1.6;color:var(--text);}
  .sheet .transcript-text{font-size:13.5px;line-height:1.7;color:var(--text-muted);white-space:pre-wrap;}
  .sheet .delete-btn{margin-top:22px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--divider);
    background:none;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;}

  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%) translateY(20px);background:var(--surface-hi);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:12.5px;border:1px solid var(--divider);
    opacity:0;transition:all .25s ease;z-index:20;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div>
    <h1>Катушка</h1>
    <div class="sub">запись → расшифровка → папка</div>
  </div>
</header>

<div class="install-banner" id="installBanner">
  <span>Совет: добавьте на экран «Домой» через кнопку «Поделиться» в Safari — будет работать как обычное приложение.</span>
  <button id="dismissBanner">✕</button>
</div>

<div class="recorder">
  <canvas class="waveform" id="waveform"></canvas>
  <div class="counter mono"><span id="counterText">00:00</span><span class="dim" id="counterHint"></span></div>
  <button class="rec-btn" id="recBtn"><div class="core" id="recCore"></div></button>
  <div class="rec-hint" id="recHint">Нажмите, чтобы начать запись</div>
  <div class="live-transcript mono" id="liveTranscript"></div>
</div>

<div class="folders" id="folders"></div>

<main id="main"></main>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheetContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const els = {
    recBtn: document.getElementById('recBtn'),
    recCore: document.getElementById('recCore'),
    recHint: document.getElementById('recHint'),
    counterText: document.getElementById('counterText'),
    counterHint: document.getElementById('counterHint'),
    liveTranscript: document.getElementById('liveTranscript'),
    waveform: document.getElementById('waveform'),
    folders: document.getElementById('folders'),
    main: document.getElementById('main'),
    overlay: document.getElementById('overlay'),
    sheet: document.getElementById('sheet'),
    sheetContent: document.getElementById('sheetContent'),
    toast: document.getElementById('toast'),
    installBanner: document.getElementById('installBanner'),
    dismissBanner: document.getElementById('dismissBanner'),
  };

  let state = { entries: [], folders: [] };
  let activeFolder = 'Все';
  let isRecording = false;
  let mediaRecorder, audioChunks = [], recognition, recognitionShouldRun = false;
  let finalTranscript = '', interimTranscript = '';
  let audioCtx, analyser, sourceNode, rafId, canvasCtx;
  let startTime, timerInterval;
  let currentStream;

  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    setTimeout(()=>els.toast.classList.remove('show'), 2200);
  }

  // ---------- Storage ----------
  async function loadState(){
    try{
      const res = await window.storage.get('app-data');
      if(res && res.value){ state = JSON.parse(res.value); }
    }catch(e){ /* no data yet */ }
    try{
      const banner = await window.storage.get('banner-dismissed');
      if(banner && banner.value === 'true'){ els.installBanner.style.display='none'; }
    }catch(e){}
    render();
  }
  async function saveState(){
    try{ await window.storage.set('app-data', JSON.stringify(state)); }
    catch(e){ showToast('Не удалось сохранить данные'); }
  }
  els.dismissBanner.onclick = async ()=>{
    els.installBanner.style.display='none';
    try{ await window.storage.set('banner-dismissed','true'); }catch(e){}
  };

  // ---------- Waveform visualizer ----------
  function setupCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const rect = els.waveform.getBoundingClientRect();
    els.waveform.width = rect.width * dpr;
    els.waveform.height = rect.height * dpr;
    canvasCtx = els.waveform.getContext('2d');
    canvasCtx.scale(dpr, dpr);
  }
  function drawIdle(){
    if(!canvasCtx) return;
    const w = els.waveform.getBoundingClientRect().width, h = els.waveform.getBoundingClientRect().height;
    canvasCtx.clearRect(0,0,w,h);
    canvasCtx.fillStyle = '#312E3A';
    const bars = 40, gap = 4, bw = (w - gap*(bars-1))/bars;
    for(let i=0;i<bars;i++){
      const bh = 3;
      canvasCtx.fillRect(i*(bw+gap), h/2-bh/2, bw, bh);
    }
  }
  function drawFrame(){
    if(!analyser) return;
    const w = els.waveform.getBoundingClientRect().width, h = els.waveform.getBoundingClientRect().height;
    const bufferLength = analyser.frequencyBinCount;
    const data = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(data);
    canvasCtx.clearRect(0,0,w,h);
    const bars = 40, gap = 4, bw = (w - gap*(bars-1))/bars;
    const step = Math.floor(bufferLength / bars);
    for(let i=0;i<bars;i++){
      let sum=0;
      for(let j=0;j<step;j++){ sum += data[i*step+j] || 0; }
      const avg = sum/step;
      const bh = Math.max(3, (avg/255)*h);
      canvasCtx.fillStyle = '#FF5940';
      canvasCtx.fillRect(i*(bw+gap), h/2-bh/2, bw, bh);
    }
    rafId = requestAnimationFrame(drawFrame);
  }

  // ---------- Timer ----------
  function fmtTime(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return m+':'+s;
  }
  function startTimer(){
    startTime = Date.now();
    timerInterval = setInterval(()=>{
      els.counterText.textContent = fmtTime((Date.now()-startTime)/1000);
    }, 500);
  }
  function stopTimer(){ clearInterval(timerInterval); }

  // ---------- Speech recognition ----------
  function setupRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ return null; }
    const r = new SR();
    r.lang = 'ru-RU';
    r.continuous = true;
    r.interimResults = true;
    r.onresult = (e)=>{
      interimTranscript = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal){ finalTranscript += t + ' '; }
        else{ interimTranscript += t; }
      }
      updateLiveTranscript();
    };
    r.onerror = (e)=>{ /* swallow, will attempt restart on end */ };
    r.onend = ()=>{
      if(recognitionShouldRun){
        try{ r.start(); }catch(e){}
      }
    };
    return r;
  }
  function updateLiveTranscript(){
    els.liveTranscript.innerHTML =
      '<span class="final">'+escapeHtml(finalTranscript)+'</span>'+
      '<span>'+escapeHtml(interimTranscript)+'</span>';
    els.liveTranscript.scrollTop = els.liveTranscript.scrollHeight;
  }
  function escapeHtml(s){
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  // ---------- Recording control ----------
  els.recBtn.onclick = async ()=>{
    if(isRecording){ stopRecording(); } else { await startRecording(); }
  };

  async function startRecording(){
    try{
      currentStream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      showToast('Нет доступа к микрофону');
      return;
    }
    isRecording = true;
    finalTranscript = ''; interimTranscript = '';
    audioChunks = [];
    els.liveTranscript.innerHTML = '';
    els.recBtn.classList.add('recording');
    els.recHint.textContent = 'Идёт запись — нажмите, чтобы остановить';
    els.counterHint.textContent = '';
    startTimer();

    // Waveform
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    sourceNode = audioCtx.createMediaStreamSource(currentStream);
    sourceNode.connect(analyser);
    drawFrame();

    // Recorder
    const candidates = ['audio/mp4','audio/webm;codecs=opus','audio/webm'];
    let mimeType;
    for(const c of candidates){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(c)){ mimeType=c; break; } }
    mediaRecorder = mimeType ? new MediaRecorder(currentStream,{mimeType}) : new MediaRecorder(currentStream);
    mediaRecorder.ondataavailable = (e)=>{ if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.start();

    // Speech recognition
    recognition = setupRecognition();
    if(recognition){
      recognitionShouldRun = true;
      try{ recognition.start(); }catch(e){}
    }else{
      els.liveTranscript.textContent = 'Живая расшифровка не поддерживается в этом браузере — попробуйте Safari на iPhone.';
    }
  }

  function stopRecording(){
    isRecording = false;
    els.recBtn.classList.remove('recording');
    els.recHint.textContent = 'Нажмите, чтобы начать запись';
    stopTimer();
    recognitionShouldRun = false;
    if(recognition){ try{ recognition.stop(); }catch(e){} }
    if(rafId) cancelAnimationFrame(rafId);
    drawIdle();
    if(sourceNode) sourceNode.disconnect();
    if(audioCtx) audioCtx.close();

    const durationSec = (Date.now()-startTime)/1000;
    const transcript = (finalTranscript+' '+interimTranscript).trim();

    mediaRecorder.onstop = async ()=>{
      currentStream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(audioChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      let audioBase64 = null;
      if(blob.size < 3_500_000){
        audioBase64 = await blobToBase64(blob);
      }
      await handleFinishedRecording(transcript, durationSec, audioBase64, mediaRecorder.mimeType||'audio/webm');
      els.counterText.textContent = '00:00';
      els.liveTranscript.innerHTML = '';
    };
    mediaRecorder.stop();
  }

  function blobToBase64(blob){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  // ---------- Categorization + save ----------
  async function handleFinishedRecording(transcript, durationSec, audioBase64, mimeType){
    const id = 'e_'+Date.now();
    const provisional = {
      id, createdAt: Date.now(), durationSec,
      transcript: transcript || '', audioBase64, mimeType,
      folder: null, title: transcript ? transcript.slice(0,40) : 'Новая запись',
      summary: null, analyzing: true
    };
    state.entries.unshift(provisional);
    render();
    await saveState();

    if(!transcript){
      provisional.analyzing = false;
      provisional.folder = 'Без текста';
      provisional.title = 'Запись без расшифровки';
      if(!state.folders.includes('Без текста')) state.folders.push('Без текста');
      render(); await saveState();
      return;
    }

    try{
      const result = await categorize(transcript, state.folders);
      provisional.folder = result.folder;
      provisional.title = result.title;
      provisional.summary = result.summary;
      if(!state.folders.includes(result.folder)) state.folders.push(result.folder);
    }catch(e){
      provisional.folder = 'Разное';
      provisional.title = transcript.slice(0,40);
      provisional.summary = null;
      if(!state.folders.includes('Разное')) state.folders.push('Разное');
      showToast('Не удалось определить папку — сохранено в «Разное»');
    }
    provisional.analyzing = false;
    render();
    await saveState();
  }

  async function categorize(transcript, existingFolders){
    const prompt = `Ты сортируешь голосовые заметки по папкам. Существующие папки: ${JSON.stringify(existingFolders)}.
Проанализируй расшифровку записи ниже. Выбери подходящую папку из существующих, если она хорошо подходит по смыслу, иначе придумай новую короткую папку (1-2 слова, на русском, например "Работа", "Идеи", "Встречи", "Личное", "Покупки").
Ответь СТРОГО в формате JSON без пояснений и без markdown-разметки:
{"folder": "...", "title": "короткий заголовок до 6 слов", "summary": "1-2 предложения с сутью записи"}

Расшифровка:
"""${transcript}"""`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{role:"user", content: prompt}]
      })
    });
    const data = await response.json();
    const text = data.content.map(b=>b.text||'').join('');
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(!parsed.folder || !parsed.title) throw new Error('bad shape');
    return parsed;
  }

  // ---------- Rendering ----------
  function timeAgo(ts){
    const diff = (Date.now()-ts)/1000;
    if(diff < 60) return 'только что';
    if(diff < 3600) return Math.floor(diff/60)+' мин назад';
    if(diff < 86400) return Math.floor(diff/3600)+' ч назад';
    return Math.floor(diff/86400)+' дн назад';
  }

  function render(){
    renderFolders();
    renderEntries();
  }

  function renderFolders(){
    const counts = {};
    state.entries.forEach(e=>{ if(e.folder){ counts[e.folder] = (counts[e.folder]||0)+1; } });
    let html = `<div class="chip ${activeFolder==='Все'?'active':''}" data-folder="Все">Все <span class="count">${state.entries.length}</span></div>`;
    state.folders.forEach(f=>{
      html += `<div class="chip ${activeFolder===f?'active':''}" data-folder="${escapeHtml(f)}">${escapeHtml(f)} <span class="count">${counts[f]||0}</span></div>`;
    });
    els.folders.innerHTML = html;
    els.folders.querySelectorAll('.chip').forEach(c=>{
      c.onclick = ()=>{ activeFolder = c.dataset.folder; render(); };
    });
  }

  function renderEntries(){
    const list = state.entries.filter(e => activeFolder==='Все' || e.folder===activeFolder);
    if(list.length===0){
      els.main.innerHTML = `<div class="empty">Пока пусто.<br>Нажмите на кнопку записи выше, чтобы создать первую заметку — она сама попадёт в нужную папку.</div>`;
      return;
    }
    els.main.innerHTML = list.map(e=>{
      if(e.analyzing){
        return `<div class="entry" data-id="${e.id}">
          <div class="entry-title">${escapeHtml(e.title)}</div>
          <div class="analyzing"><span class="spinner"></span> Определяю папку…</div>
        </div>`;
      }
      return `<div class="entry" data-id="${e.id}">
        <div class="entry-top">
          <div class="entry-title">${escapeHtml(e.title)}</div>
        </div>
        <div class="entry-meta">
          <span class="tag">${escapeHtml(e.folder||'')}</span>
          <span class="time mono">${fmtTime(e.durationSec)} · ${timeAgo(e.createdAt)}</span>
        </div>
        ${e.summary ? `<div class="entry-summary">${escapeHtml(e.summary)}</div>` : ''}
      </div>`;
    }).join('');
    els.main.querySelectorAll('.entry').forEach(el=>{
      el.onclick = ()=>openDetail(el.dataset.id);
    });
  }

  // ---------- Detail sheet ----------
  function openDetail(id){
    const e = state.entries.find(x=>x.id===id);
    if(!e || e.analyzing) return;
    els.sheetContent.innerHTML = `
      <h2>${escapeHtml(e.title)}</h2>
      <div class="meta-row">
        <span class="tag">${escapeHtml(e.folder||'')}</span>
        <span class="time mono">${fmtTime(e.durationSec)} · ${timeAgo(e.createdAt)}</span>
      </div>
      ${e.audioBase64 ? `<audio controls src="${e.audioBase64}"></audio>` : ''}
      ${e.summary ? `<div class="block-label">Суть</div><div class="summary-text">${escapeHtml(e.summary)}</div>` : ''}
      <div class="block-label">Полная расшифровка</div>
      <div class="transcript-text">${escapeHtml(e.transcript || 'Текст не распознан.')}</div>
      <button class="delete-btn" id="deleteEntryBtn">Удалить запись</button>
    `;
    document.getElementById('deleteEntryBtn').onclick = ()=>deleteEntry(id);
    els.overlay.classList.add('open');
    els.sheet.classList.add('open');
  }
  function closeDetail(){
    els.overlay.classList.remove('open');
    els.sheet.classList.remove('open');
  }
  els.overlay.onclick = closeDetail;

  async function deleteEntry(id){
    state.entries = state.entries.filter(e=>e.id!==id);
    closeDetail();
    render();
    await saveState();
    showToast('Запись удалена');
  }

  // ---------- Init ----------
  window.addEventListener('resize', ()=>{ setupCanvas(); if(!isRecording) drawIdle(); });
  setupCanvas();
  drawIdle();
  loadState();
})();
</script>
</body>
</html>
